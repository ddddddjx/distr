<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1b12" />
  <title>SwingCoach · 高尔夫挥杆 AI 分析</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header id="topbar">
      <div class="brand"><span class="brand-dot"></span>SwingCoach</div>
      <div class="status-pill" id="phasePill">未开始</div>
      <button id="statsBtn" class="icon-btn" title="练习统计">📊</button>
      <button id="voiceBtn" class="icon-btn" title="语音指导开关">🔊</button>
      <div class="fps" id="fpsLabel"></div>
    </header>

    <!-- 相机画面 + 骨骼叠加层 -->
    <main id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>

      <!-- 实时反馈浮层 -->
      <div id="liveFaults"></div>

      <!-- 站位辅助提示 -->
      <div id="hint" class="hint hidden"></div>
    </main>

    <!-- 控制面板 -->
    <footer id="controls">
      <div class="row">
        <div class="seg" id="viewSeg">
          <button data-view="front" class="active">正面拍摄</button>
          <button data-view="side">侧面拍摄</button>
        </div>
        <div class="seg" id="handSeg">
          <button data-hand="right" class="active">右手球员</button>
          <button data-hand="left">左手球员</button>
        </div>
      </div>
      <div class="row">
        <button id="flipBtn" class="ghost">切换镜头</button>
        <button id="uploadBtn" class="ghost">上传视频</button>
      </div>
      <div class="row">
        <button id="startBtn" class="primary">开始分析</button>
      </div>
      <input type="file" id="videoInput" accept="video/*" hidden />
    </footer>

    <!-- 挥杆总结弹窗 -->
    <div id="summaryModal" class="modal hidden">
      <div class="modal-card">
        <h2>本次挥杆分析报告</h2>
        <div id="summaryScore" class="score"></div>
        <div id="summaryTempo" class="tempo hidden"></div>
        <video id="replayVideo" class="replay hidden" playsinline muted loop></video>
        <div id="keyframesWrap" class="keyframes hidden"></div>
        <div id="summaryBody"></div>
        <button id="closeSummary" class="primary">继续练习</button>
      </div>
    </div>

    <!-- 练习统计面板 -->
    <div id="statsModal" class="modal hidden">
      <div class="modal-card">
        <h2>练习统计</h2>
        <div id="statsBody"></div>
        <button id="closeStats" class="primary">关闭</button>
      </div>
    </div>

    <!-- 模式选择页：摄像头仅在用户明确选择实时模式后才开启 -->
    <div id="chooser" class="modal hidden">
      <div class="modal-card">
        <div class="brand chooser-brand"><span class="brand-dot"></span>SwingCoach</div>
        <h2>选择使用方式</h2>
        <button id="chooseLive" class="primary big">实时拍摄分析</button>
        <p class="choose-note">开启摄像头对着球员拍摄，挥杆时实时语音指导</p>
        <button id="chooseUpload" class="ghost big">上传视频分析</button>
        <p class="choose-note">从相册选择已拍好的挥杆视频，无需开启摄像头</p>
      </div>
    </div>

    <!-- 语音设置面板 -->
    <div id="voiceModal" class="modal hidden">
      <div class="modal-card">
        <h2>语音指导</h2>
        <div class="voice-row" id="voiceToggleRow">
          <span>实时语音提示</span>
          <span class="switch on" id="voiceSwitch"></span>
        </div>
        <div class="voice-section-label">音色（点击试听）</div>
        <div id="voiceList"></div>
        <p class="voice-note">
          音色来自手机系统语音库，不同设备可选项不同。出于声音肖像权保护，
          无法使用真人明星的声音；选择台湾口音女声可获得相近的温柔风格。
        </p>
        <button id="closeVoice" class="primary">完成</button>
      </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loading" class="modal">
      <div class="modal-card">
        <div class="spinner"></div>
        <p id="loadingText">正在加载 AI 姿态模型…</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
